services:
  - type: web
    name: warmi-bypass-auth
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://santiagowarmi8-creator.github.io
