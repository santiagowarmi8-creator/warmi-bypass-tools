<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Warmi Admin</title>
<style>
:root{--bg:#0e1117;--card:#171c26;--line:#293242;--text:#f5f7fb;--muted:#9aa6b8;--green:#35c46a;--red:#ef6262;--blue:#5b8cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit;border-radius:9px;padding:11px 13px}input{background:#10151e;color:var(--text);border:1px solid var(--line);width:100%}button{border:0;background:var(--green);color:#07120b;cursor:pointer;font-weight:650}.shell{min-height:100vh;display:flex}.side{width:240px;background:#121722;border-right:1px solid var(--line);padding:25px 16px}.brand{font-size:20px;font-weight:750;margin:0 10px 35px}.brand span{color:var(--green)}.nav{display:grid;gap:7px}.nav button{background:transparent;color:var(--muted);text-align:left;font-weight:500}.nav button.active,.nav button:hover{background:#202b3c;color:var(--text)}.main{flex:1;padding:32px;max-width:1250px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.top h1{margin:0;font-size:28px}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}.stat b{display:block;font-size:28px;margin-top:7px}.panel h2{margin:0 0 18px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.toolbar input{max-width:280px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;text-transform:uppercase}.pill{display:inline-block;border-radius:20px;padding:5px 10px;font-size:12px}.on{background:#173f29;color:#72e19a}.off{background:#43252a;color:#ff9696}.actions button{font-size:12px;padding:8px 10px;margin-right:5px}.ghost{background:#273246;color:#dce5f5}.danger{background:#52272c;color:#ffb2b2}.login{max-width:410px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px}.login h1{margin-top:0}.login label{display:block;margin:16px 0 6px;color:var(--muted)}.login button{width:100%;margin-top:20px}.msg{min-height:22px;color:#ff9b9b;margin-top:12px}@media(max-width:760px){.side{width:62px;padding:20px 8px}.brand{font-size:0}.brand span{font-size:20px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:18px}.main{padding:20px}.stats{grid-template-columns:1fr}.top h1{font-size:23px}}
</style></head><body>
<section id="login" class="login"><h1>Warmi <span style="color:var(--green)">Admin</span></h1><p class="muted">Control de acceso y usuarios</p><label>Usuario administrador</label><input id="adminUser" autocomplete="username"><label>Contraseña</label><input id="adminPass" type="password" autocomplete="current-password"><button id="enter">Entrar al panel</button><div id="loginMsg" class="msg"></div></section>
<div id="app" class="shell" hidden><aside class="side"><div class="brand">Warmi <span>Admin</span></div><nav class="nav"><button class="active">▣　Dashboard</button><button onclick="logout()">↪　Cerrar sesión</button></nav></aside><main class="main"><div class="top"><div><h1>Dashboard</h1><div class="muted">Administra los accesos de tu aplicación</div></div><button onclick="openCreate()">＋ Crear usuario</button></div><div class="stats"><div class="card stat"><span class="muted">Usuarios totales</span><b id="total">0</b></div><div class="card stat"><span class="muted">Activos</span><b id="active">0</b></div><div class="card stat"><span class="muted">Inactivos</span><b id="inactive">0</b></div></div><section class="panel"><div class="toolbar"><h2>Usuarios</h2><input id="search" placeholder="Buscar usuario..." oninput="render()"></div><div id="createBox" hidden class="card" style="margin-bottom:18px"><div class="toolbar"><h2>Nuevo usuario</h2><button class="ghost" onclick="closeCreate()">Cancelar</button></div><div class="toolbar"><input id="newUser" placeholder="Nombre de usuario"><input id="newPass" type="password" placeholder="Contraseña"><button onclick="createUser()">Guardar</button></div></div><div id="msg" class="muted"></div><div class="tablewrap"><table><thead><tr><th>Usuario</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="users"></tbody></table></div></section></main></div>
<script>
const api='https://warmi-bypass-auth.onrender.com';let token='',data=[];const $=x=>document.getElementById(x);
async function load(){const r=await fetch(api+'/admin/users',{headers:{'X-Admin-Token':token}});if(!r.ok)return logout();data=await r.json();render()}
function render(){const q=($('search')?.value||'').toLowerCase();const rows=data.filter(x=>x.username.toLowerCase().includes(q));$('total').textContent=data.length;$('active').textContent=data.filter(x=>x.active).length;$('inactive').textContent=data.filter(x=>!x.active).length;$('users').innerHTML=rows.map(x=>'<tr><td><b>'+x.username+'</b></td><td><span class="pill '+(x.active?'on':'off')+'">'+(x.active?'Activo':'Inactivo')+'</span></td><td class="actions"><button class="ghost" onclick="toggle(\''+encodeURIComponent(x.username)+'\')">'+(x.active?'Desactivar':'Activar')+'</button><button class="danger" onclick="removeUser(\''+encodeURIComponent(x.username)+'\')">Eliminar</button></td></tr>').join('')||'<tr><td colspan="3" class="muted">No hay usuarios creados.</td></tr>'}
$('enter').onclick=async()=>{const b=new URLSearchParams({username:$('adminUser').value,password:$('adminPass').value});const r=await fetch(api+'/admin/login',{method:'POST',body:b});if(!r.ok)return $('loginMsg').textContent='Credenciales inválidas';token=(await r.json()).token;$('login').hidden=true;$('app').hidden=false;load()}
async function createUser(){const b=new URLSearchParams({username:$('newUser').value,password:$('newPass').value});const r=await fetch(api+'/admin/users',{method:'POST',headers:{'X-Admin-Token':token},body:b});$('msg').textContent=r.ok?'Usuario creado correctamente.':'No se pudo crear el usuario.';if(r.ok){$('newUser').value='';$('newPass').value='';closeCreate();load()}}
async function toggle(u){await fetch(api+'/admin/users/'+u,{method:'PATCH',headers:{'X-Admin-Token':token}});load()}
async function removeUser(u){if(confirm('¿Eliminar definitivamente este usuario?')){await fetch(api+'/admin/users/'+u,{method:'DELETE',headers:{'X-Admin-Token':token}});load()}}
function openCreate(){$('createBox').hidden=false}function closeCreate(){$('createBox').hidden=true}function logout(){token='';$('app').hidden=true;$('login').hidden=false}
</script></body></html>
