<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Warmi Bypass Tools</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14161b;color:#f3f4f6;font:16px system-ui}main{width:min(760px,calc(100% - 32px));padding:28px;border-radius:16px;background:#22252c}input,button{padding:11px;border-radius:8px;border:1px solid #4a5160;font:inherit}input{background:#17191e;color:white}button{background:#35b85a;color:white;border:0;cursor:pointer;margin:4px}.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:160px}table{width:100%;margin-top:20px;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #4a5160}.muted{color:#bcc3cf}</style></head><body><main><h1>Warmi Bypass Tools</h1><p class="muted">Panel de control de usuarios</p><section id="login"><h2>Administrador</h2><div class="row"><input id="adminUser" placeholder="Usuario"><input id="adminPass" type="password" placeholder="Contraseña"><button id="enter">Entrar</button></div></section><section id="panel" hidden><h2>Usuarios</h2><div class="row"><input id="newUser" placeholder="Nuevo usuario"><input id="newPass" type="password" placeholder="Contraseña"><button id="add">Crear usuario</button></div><div id="status"></div><table><thead><tr><th>Usuario</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="users"></tbody></table></section></main><script>const api='https://warmi-bypass-auth.onrender.com';let token='';const $=id=>document.getElementById(id);function msg(x){$('status').textContent=x}async function load(){const r=await fetch(api+'/admin/users',{headers:{'X-Admin-Token':token}});if(!r.ok)return msg('Sesión expirada.');const rows=await r.json();$('users').innerHTML=rows.map(u=>'<tr><td>'+u.username+'</td><td>'+(u.active?'Activo':'Inactivo')+'</td><td><button onclick="toggleUser(\''+encodeURIComponent(u.username)+'\')">'+(u.active?'Desactivar':'Activar')+'</button><button onclick="removeUser(\''+encodeURIComponent(u.username)+'\')">Eliminar</button></td></tr>').join('')}async function toggleUser(u){await fetch(api+'/admin/users/'+u,{method:'PATCH',headers:{'X-Admin-Token':token}});load()}async function removeUser(u){if(confirm('¿Eliminar este usuario?')){await fetch(api+'/admin/users/'+u,{method:'DELETE',headers:{'X-Admin-Token':token}});load()}}$('enter').onclick=async()=>{const b=new URLSearchParams({username:$('adminUser').value,password:$('adminPass').value});const r=await fetch(api+'/admin/login',{method:'POST',body:b});if(!r.ok)return msg('Credenciales inválidas.');token=(await r.json()).token;$('login').hidden=true;$('panel').hidden=false;load()};$('add').onclick=async()=>{const b=new URLSearchParams({username:$('newUser').value,password:$('newPass').value});const r=await fetch(api+'/admin/users',{method:'POST',headers:{'X-Admin-Token':token},body:b});msg(r.ok?'Usuario creado.':'No se pudo crear.');if(r.ok){$('newUser').value='';$('newPass').value='';load()}}</script></body></html>
