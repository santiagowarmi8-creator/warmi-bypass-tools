<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warmi Bypass Tools</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14161b; color: #f3f4f6; font: 16px system-ui, sans-serif; }
    main { width: min(420px, calc(100% - 40px)); padding: 32px; border-radius: 16px; background: #22252c; box-shadow: 0 18px 50px #0006; }
    h1 { margin-top: 0; }
    label { display: block; margin: 16px 0 6px; color: #c9ced8; }
    input, button { box-sizing: border-box; width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #4a5160; font: inherit; }
    input { background: #17191e; color: white; }
    button { margin-top: 22px; border: 0; background: #35b85a; color: white; cursor: pointer; }
    #status { min-height: 24px; margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>Warmi Bypass Tools</h1>
    <p>Panel de acceso del servidor propio.</p>
    <form id="login">
      <label for="username">Usuario</label>
      <input id="username" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Iniciar sesión</button>
    </form>
    <div id="status" role="status"></div>
  </main>
  <script>
    const api = 'https://warmi-bypass-auth.onrender.com';
    const form = document.getElementById('login');
    const userField = document.getElementById('username');
    const passwordField = document.getElementById('password');
    const statusField = document.getElementById('status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      statusField.textContent = 'Conectando con el servidor...';
      try {
        const body = new URLSearchParams({
          username: userField.value,
          password: passwordField.value,
          mac_adress: 'web'
        });
        const response = await fetch(api + '/user/auth/', { method: 'POST', body });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const result = await response.json();
        statusField.textContent = result.auth
          ? 'Acceso correcto.'
          : 'Usuario o contraseña incorrectos.';
      } catch (error) {
        statusField.textContent = 'El servidor todavía no está disponible. Inténtalo cuando Render termine el despliegue.';
      }
    });
  </script>
</body>
</html>
